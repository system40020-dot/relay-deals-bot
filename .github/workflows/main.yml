name: Relay Deals Bot

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run relay bot
        env:
          RELAY_BOT_TOKEN: ${{ secrets.RELAY_BOT_TOKEN }}
          MAIN_BOT_TOKEN: ${{ secrets.MAIN_BOT_TOKEN }}
          STAGING_CHAT_ID: ${{ secrets.STAGING_CHAT_ID }}
          MAIN_CHAT_ID: ${{ secrets.MAIN_CHAT_ID }}
        run: python relay_bot.py

      - name: Commit updated state
        run: |
          git config --global user.name "relay-deals-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add state.json
          git commit -m "Update relay state" || exit 0
          git pull --rebase origin main
          git push
          
