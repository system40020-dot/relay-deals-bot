name: Relay Deals Bot

on:
  schedule:
    - cron: "*/15 * * * *"   # checks every 15 minutes for new staging posts
  workflow_dispatch:

jobs:
  relay-deal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run relay bot
        env:
          RELAY_BOT_TOKEN: ${{ secrets.RELAY_BOT_TOKEN }}
          STAGING_CHAT_ID: ${{ secrets.STAGING_CHAT_ID }}
          MAIN_BOT_TOKEN: ${{ secrets.MAIN_BOT_TOKEN }}
          MAIN_CHAT_ID: ${{ secrets.MAIN_CHAT_ID }}
        run: python relay_bot.py

      - name: Commit updated state
        run: |
          git config --global user.name "relay-deals-bot"
          git config --global user.email "relay-deals-bot@users.noreply.github.com"
          git add state.json
          git commit -m "Update relay state" || echo "No changes to commit"
          git push
